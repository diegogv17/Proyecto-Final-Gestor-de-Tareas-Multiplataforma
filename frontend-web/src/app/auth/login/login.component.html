<!-- ══════════════════════════════════════════════════════
     TaskFlow — Login / Register
     ══════════════════════════════════════════════════════ -->

<!-- NAVBAR -->
<header class="navbar">
  <div class="logo">
    <svg class="logo-icon" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="36" height="36" rx="10" fill="#ffffff22"/>
      <path d="M10 13h16M10 18h10M10 23h13" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="27" cy="23" r="4" fill="#a8bfc9" stroke="white" stroke-width="1.5"/>
      <path d="M25.5 23l1 1 2-2" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    TaskFlow
  </div>
</header>

<!-- MAIN -->
<main class="login-container">

  <!-- ── CARD ── -->
  <div class="login-card">

    <!-- TABS -->
    <div class="tabs">
      <button
        class="tab"
        [class.active]="activeTab === 'login'"
        (click)="switchTab('login')">
        Iniciar Sesión
      </button>
      <button
        class="tab"
        [class.active]="activeTab === 'register'"
        (click)="switchTab('register')">
        Registrarse
      </button>
    </div>

    <!-- ── GLOBAL MESSAGES ── -->
    <div class="alert alert-error"   *ngIf="errorMessage">{{ errorMessage }}</div>
    <div class="alert alert-success" *ngIf="successMessage">{{ successMessage }}</div>

    <!-- ════════════════════════════════════════
         LOGIN FORM
         ════════════════════════════════════════ -->
    <form *ngIf="activeTab === 'login'" class="auth-form" (ngSubmit)="onLogin()" #loginForm="ngForm">

      <div class="input-group">
        <label for="loginEmail">Usuario / Correo</label>
        <input
          id="loginEmail"
          type="text"
          placeholder="Ingrese usuario o correo"
          [(ngModel)]="loginEmail"
          name="loginEmail"
          autocomplete="username"
          required />
      </div>

      <div class="input-group">
        <label for="loginPassword">Contraseña</label>
        <div class="password-wrapper">
          <input
            id="loginPassword"
            [type]="showLoginPass ? 'text' : 'password'"
            placeholder="Ingrese su contraseña"
            [(ngModel)]="loginPassword"
            name="loginPassword"
            autocomplete="current-password"
            required />
          <button type="button" class="toggle-pass" (click)="showLoginPass = !showLoginPass"
                  [attr.aria-label]="showLoginPass ? 'Ocultar contraseña' : 'Mostrar contraseña'">
            <!-- Eye icon -->
            <svg *ngIf="!showLoginPass" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
            <!-- Eye-off icon -->
            <svg *ngIf="showLoginPass" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="form-options">
        <label class="remember-label">
          <input type="checkbox" [(ngModel)]="rememberMe" name="rememberMe"> Recordarme
        </label>
      </div>

      <button type="submit" class="btn-primary" [disabled]="loading">
        <span *ngIf="!loading">Iniciar Sesión</span>
        <span *ngIf="loading" class="spinner"></span>
      </button>

    </form>

    <!-- ════════════════════════════════════════
         REGISTER FORM
         ════════════════════════════════════════ -->
    <form *ngIf="activeTab === 'register'" class="auth-form" (ngSubmit)="onRegister()" #regForm="ngForm">

      <div class="input-group">
        <label for="regUsername">Nombre de usuario</label>
        <input
          id="regUsername"
          type="text"
          placeholder="Ingrese nombre de usuario"
          [(ngModel)]="registerUsername"
          name="regUsername"
          required />
      </div>

      <div class="input-group">
        <label for="regEmail">Correo electrónico</label>
        <input
          id="regEmail"
          type="email"
          placeholder="Ingrese correo electrónico"
          [(ngModel)]="registerEmail"
          name="regEmail"
          required />
      </div>

      <div class="input-group">
        <label for="regPassword">Contraseña</label>
        <div class="password-wrapper">
          <input
            id="regPassword"
            [type]="showRegPass ? 'text' : 'password'"
            placeholder="Crear contraseña"
            [(ngModel)]="registerPassword"
            name="regPassword"
            required />
          <button type="button" class="toggle-pass" (click)="showRegPass = !showRegPass">
            <svg *ngIf="!showRegPass" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
            <svg *ngIf="showRegPass" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="input-group">
        <label for="regConfirm">Confirmar contraseña</label>
        <div class="password-wrapper">
          <input
            id="regConfirm"
            [type]="showRegConfirm ? 'text' : 'password'"
            placeholder="Confirmar contraseña"
            [(ngModel)]="registerConfirm"
            name="regConfirm"
            required />
          <button type="button" class="toggle-pass" (click)="showRegConfirm = !showRegConfirm">
            <svg *ngIf="!showRegConfirm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
            <svg *ngIf="showRegConfirm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-primary" [disabled]="loading">
        <span *ngIf="!loading">Continuar</span>
        <span *ngIf="loading" class="spinner"></span>
      </button>

    </form>

  </div><!-- /login-card -->

</main>
